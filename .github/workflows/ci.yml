name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran and OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev

      - name: Build
        run: make LAPACK="-lopenblas"

      - name: Test
        run: make test LAPACK="-lopenblas"
